<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SMHOS</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="nav-container">

            <a href="index.html" class="brand">

                <div class="smhos-logo">
                <img src="assets/logo.png" alt="SMHOS Logo">
                </div>
            </a>

            <a href="register.html" class="nav-login">
                Create Account
            </a>

        </div>



    </header>


    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <div class="smhos-logo">
                    <img src="assets/logo.png" alt="SMHOS Logo">
                </div>

                <h1>Welcome back</h1>

                <p>
                    Sign in to continue to your SMHOS
                    mental wellbeing space.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div id="loginMessage" class="form-message"></div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create one
                    </a>
                </p>

            </div>

        </div>

    </main>

    <div>
    <a href="index.html" class="nav-index">BACK TO HOMEPAGE</a>
    </div>

    <script type="module" src="js/auth.js"></script>

</body>

</html>
