<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | SMHOS</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="nav-container">

            <div class="smhos-logo">
                <img src="assets/logo.png" alt="SMHOS Logo">
            </div>

            <a href="login.html" class="nav-login">
                Login
            </a>

        </div>
    </header>


    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

               <div class="smhos-logo">
                <img src="assets/logo.png" alt="SMHOS Logo">
                </div>

                <h1>Create your account</h1>

                <p>
                    Join SMHOS and take the first step toward
                    better mental wellbeing.
                </p>

            </div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="studentId">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Enter your student ID"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <div id="registerMessage" class="form-message"></div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </div>
            <br>

             <div>
            <a href="index.html" class="nav-index">BACK TO HOMEPAGE</a>
             </div>

        </div>

    </main>


    <script type="module" src="js/auth.js"></script>

</body>
</html>
